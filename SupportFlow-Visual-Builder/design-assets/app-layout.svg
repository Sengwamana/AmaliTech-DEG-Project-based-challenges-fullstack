<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="toolbarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111624" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#111624" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5"/>
      <stop offset="100%" stop-color="#20c997"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1a2032" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#090b14"/>

  <!-- Canvas ambient glow -->
  <ellipse cx="432" cy="300" rx="400" ry="400" fill="#4c6ef5" fill-opacity="0.03"/>
  <ellipse cx="1008" cy="600" rx="350" ry="350" fill="#20c997" fill-opacity="0.02"/>

  <!-- Dot grid -->
  <rect x="0" y="48" width="1440" height="852" fill="url(#dotGrid)" fill-opacity="0.3"/>

  <!-- Toolbar -->
  <rect x="0" y="0" width="1440" height="48" fill="url(#toolbarBg)" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.38"/>

  <!-- Logo -->
  <rect x="16" y="10" width="28" height="28" rx="6" fill="url(#logoGrad)"/>
  <!-- Branch icon -->
  <path d="M22 18h4l-2-4zM22 18h4l-2 4zM22 18h-4" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="52" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#d1d6e3">SupportFlow Builder</text>

  <!-- Divider -->
  <line x1="210" y1="12" x2="210" y2="36" stroke="#232a3e" stroke-width="1" stroke-opacity="0.38"/>

  <!-- Undo button -->
  <rect x="224" y="10" width="32" height="28" rx="6" fill="transparent"/>
  <path d="M238 22l-4-4 4-4" fill="none" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M226 18h8a4 4 0 014 4" fill="none" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Redo button -->
  <rect x="260" y="10" width="32" height="28" rx="6" fill="transparent"/>
  <path d="M278 22l4-4-4-4" fill="none" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M282 18h-8a4 4 0 00-4 4" fill="none" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mode toggle -->
  <rect x="600" y="10" width="140" height="28" rx="10" fill="#1a2032" stroke="#232a3e" stroke-width="1" stroke-opacity="0.25"/>
  <rect x="602" y="12" width="66" height="24" rx="8" fill="#232a3e"/>
  <text x="620" y="29" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#d1d6e3">Edit</text>
  <text x="682" y="29" font-family="Inter, sans-serif" font-size="13" fill="#5c6685">Preview</text>

  <!-- Reset button -->
  <rect x="760" y="10" width="32" height="28" rx="6" fill="transparent"/>
  <path d="M772 16a8 8 0 108 8" fill="none" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="780,12 780,20 772,16" fill="#5c6685"/>

  <!-- Canvas area: 3 nodes with connectors -->

  <!-- Node 1: Start node -->
  <rect x="200" y="200" width="224" height="90" rx="12" fill="#111624" fill-opacity="0.5" stroke="#20c997" stroke-width="1" stroke-opacity="0.19"/>
  <!-- Badge -->
  <rect x="216" y="216" width="48" height="18" rx="4" fill="#20c997" fill-opacity="0.09" stroke="#20c997" stroke-width="1" stroke-opacity="0.13"/>
  <text x="220" y="229" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#38d9a9" letter-spacing="0.5">START</text>
  <text x="400" y="229" font-family="JetBrains Mono, monospace" font-size="10" fill="#47516b">node-001</text>
  <text x="216" y="258" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#d1d6e3">Welcome! How can I help you today?</text>

  <!-- Node 2: Question node -->
  <rect x="200" y="480" width="224" height="140" rx="12" fill="#111624" fill-opacity="0.5" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.19"/>
  <rect x="216" y="496" width="62" height="18" rx="4" fill="#4c6ef5" fill-opacity="0.09" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.13"/>
  <text x="220" y="509" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#748ffc" letter-spacing="0.5">QUESTION</text>
  <text x="400" y="509" font-family="JetBrains Mono, monospace" font-size="10" fill="#47516b">node-002</text>
  <text x="216" y="536" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#d1d6e3">Are you looking for support or account help?</text>
  <!-- Options -->
  <line x1="200" y1="558" x2="424" y2="558" stroke="#232a3e" stroke-width="1" stroke-opacity="0.38"/>
  <circle cx="224" cy="578" r="3" fill="#4c6ef5" fill-opacity="0.5"/>
  <text x="234" y="582" font-family="Inter, sans-serif" font-size="12" fill="#7d88a8">Technical Support</text>
  <circle cx="224" cy="598" r="3" fill="#47516b"/>
  <text x="234" y="602" font-family="Inter, sans-serif" font-size="12" fill="#7d88a8">Billing &amp; Account</text>

  <!-- Node 3: End node -->
  <rect x="600" y="480" width="224" height="80" rx="12" fill="#111624" fill-opacity="0.5" stroke="#232a3e" stroke-width="1" stroke-opacity="0.13"/>
  <rect x="616" y="496" width="28" height="18" rx="4" fill="#47516b" fill-opacity="0.13" stroke="#47516b" stroke-width="1" stroke-opacity="0.13"/>
  <text x="620" y="509" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#7d88a8" letter-spacing="0.5">END</text>
  <text x="800" y="509" font-family="JetBrains Mono, monospace" font-size="10" fill="#47516b">node-005</text>
  <text x="616" y="538" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#d1d6e3">Thanks for contacting us!</text>

  <!-- Connectors -->
  <!-- Start to Question -->
  <path d="M312 290 C312 380, 312 380, 312 480" fill="none" stroke="url(#lineGrad1)" stroke-width="1.5"/>
  <polygon points="308,478 312,488 316,478" fill="#47516b"/>

  <defs>
    <linearGradient id="lineGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#47516b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#47516b" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#47516b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#47516b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Question to End connector -->
  <path d="M312 620 C312 620, 712 620, 712 560" fill="none" stroke="url(#lineGrad2)" stroke-width="1.5"/>
  <polygon points="708,562 712,552 716,562" fill="#47516b"/>

  <!-- Right-side Node Editor placeholder -->
  <rect x="1152" y="48" width="288" height="852" fill="#111624" fill-opacity="0.19" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.38"/>
  <text x="1296" y="460" font-family="Inter, sans-serif" font-size="13" fill="#5c6685" text-anchor="middle">Node Editor panel</text>
  <text x="1296" y="478" font-family="Inter, sans-serif" font-size="12" fill="#47516b" text-anchor="middle">Click a node to edit</text>
</svg>
