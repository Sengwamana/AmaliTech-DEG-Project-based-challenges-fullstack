  <path d="M22 56h4l-2-4zM22 56h4l-2 4zM22 56h-4" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="67" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#d1d6e3">SupportFlow Builder</text>

  <line x1="210" y1="50" x2="210" y2="74" stroke="#232a3e" stroke-width="1" stroke-opacity="0.38"/>

  <!-- Undo: active -->
