<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <rect width="480" height="160" fill="#090b14"/>

  <!-- Default state -->
  <text x="12" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">DEFAULT</text>
  <rect x="12" y="38" width="448" height="36" rx="12" fill="#1a2032" fill-opacity="0.5" stroke="#232a3e" stroke-width="1" stroke-opacity="0.38"/>
  <circle cx="36" cy="56" r="7" fill="none" stroke="#5c6685" stroke-width="1.5"/>
  <line x1="41" y1="61" x2="46" y2="66" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>
  <text x="56" y="61" font-family="Inter, sans-serif" font-size="13" fill="#5c6685">Search files and folders...</text>

  <!-- Focused state -->
  <text x="12" y="104" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">FOCUSED</text>
  <rect x="12" y="118" width="448" height="36" rx="12" fill="#1a2032" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.25"/>
  <!-- Focus ring -->
  <rect x="12" y="118" width="448" height="36" rx="12" fill="none" stroke="#4c6ef5" stroke-width="2" stroke-opacity="0.13" stroke-dasharray="0"/>
  <circle cx="36" cy="136" r="7" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <line x1="41" y1="141" x2="46" y2="146" stroke="#748ffc" stroke-width="1.5" stroke-linecap="round"/>
  <text x="56" y="141" font-family="Inter, sans-serif" font-size="13" fill="#d1d6e3">quarterly</text>

  <!-- Clear button -->
  <circle cx="436" cy="136" r="8" fill="#232a3e" fill-opacity="0.5"/>
  <line x1="432" y1="132" x2="440" y2="140" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="432" y1="140" x2="440" y2="132" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Results count -->
  <text x="420" y="141" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#5c6685">3</text>
</svg>
