<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="headerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090b14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090b14" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5"/>
      <stop offset="50%" stop-color="#3b5bdb"/>
      <stop offset="100%" stop-color="#2b3fa0"/>
    </linearGradient>
    <linearGradient id="mainGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4c6ef5" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="welcomeIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#4c6ef5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#111624" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="#090b14"/>

  <!-- Main area gradient glow -->
  <rect x="288" y="56" width="896" height="844" fill="url(#mainGlow)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="56" fill="url(#headerBg)" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.6"/>

  <!-- Logo -->
  <rect x="20" y="12" width="32" height="32" rx="8" fill="url(#logoGrad)"/>
  <!-- Shield icon -->
  <path d="M16 28s6-3 6-7.5V13l-6-2.25L10 13v7.5c0 4.5 6 7.5 6 7.5z" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Title -->
  <text x="64" y="24" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#d1d6e3">SecureVault</text>
  <text x="64" y="40" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#5c6685" letter-spacing="0.5">Enterprise File Explorer</text>

  <!-- Search bar -->
  <rect x="320" y="14" width="448" height="28" rx="12" fill="#1a2032" fill-opacity="0.5" stroke="#232a3e" stroke-opacity="0.38"/>
  <!-- Search icon -->
  <circle cx="344" cy="28" r="7" fill="none" stroke="#5c6685" stroke-width="1.5"/>
  <line x1="349" y1="33" x2="353" y2="37" stroke="#5c6685" stroke-width="1.5" stroke-linecap="round"/>
  <text x="362" y="32" font-family="Inter, sans-serif" font-size="13" fill="#5c6685">Search files and folders...</text>

  <!-- Kbd badge -->
  <rect x="705" y="17" width="50" height="22" rx="6" fill="#1a2032" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <rect x="708" y="19" width="30" height="18" rx="4" fill="#1a2032" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <text x="714" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d88a8">Ctrl</text>
  <text x="741" y="32" font-family="Inter, sans-serif" font-size="10" fill="#5c6685">K</text>

  <!-- Avatar -->
  <circle cx="770" cy="28" r="14" fill="#1a2032" fill-opacity="0.5" stroke="#232a3e" stroke-opacity="0.44"/>
  <circle cx="770" cy="28" r="14" fill="url(#logoGrad)" fill-opacity="0.2"/>
  <text x="765" y="33" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#748ffc">SV</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="288" height="844" fill="#111624" fill-opacity="0.25" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.38"/>

  <!-- Sidebar section header: File Explorer -->
  <rect x="0" y="56" width="288" height="36" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.25"/>
  <rect x="12" y="64" width="20" height="20" rx="6" fill="#4c6ef5" fill-opacity="0.1" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.13"/>
  <!-- Folder icon in header -->
  <path d="M7 73h14a2 2 0 012 2v8a2 2 0 01-2 2H7a2 2 0 01-2-2v-8a2 2 0 012-2z" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <path d="M7 71a2 2 0 012-2h4l2 2h5a2 2 0 012 2" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <text x="40" y="80" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.8">FILE EXPLORER</text>
  <circle cx="274" cy="74" r="2" fill="#47516b" fill-opacity="0.25"/>

  <!-- Empty folder state in sidebar -->
  <text x="144" y="220" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#5c6685" text-anchor="middle">No files to display</text>
  <text x="144" y="238" font-family="Inter, sans-serif" font-size="12" fill="#47516b" text-anchor="middle">Select a folder to explore</text>

  <!-- Welcome state in main area -->
  <!-- Icon container -->
  <rect x="672" y="340" width="80" height="80" rx="16" fill="url(#welcomeIconGrad)" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.13"/>
  <!-- Folder icon -->
  <path d="M682 380h40a4 4 0 014 4v12a4 4 0 01-4 4h-40a4 4 0 01-4-4v-12a4 4 0 014-4z" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <path d="M682 378a4 4 0 014-4h8l4 4h12a4 4 0 014 4" fill="none" stroke="#748ffc" stroke-width="1.5"/>

  <!-- Welcome title -->
  <text x="712" y="450" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#a8b1c9" text-anchor="middle">Welcome to SecureVault</text>
  <text x="712" y="472" font-family="Inter, sans-serif" font-size="13" fill="#5c6685" text-anchor="middle">Browse your encrypted files from the sidebar.</text>
  <text x="712" y="490" font-family="Inter, sans-serif" font-size="13" fill="#5c6685" text-anchor="middle">Use the search bar to locate documents across all nested folders.</text>

  <!-- Kbd shortcuts -->
  <rect x="600" y="512" height="26" rx="8" fill="#111624" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <rect x="604" y="515" width="20" height="18" rx="4" fill="#232a3e" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <text x="610" y="528" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d88a8">↑↓</text>
  <text x="628" y="527" font-family="Inter, sans-serif" font-size="10" fill="#47516b">Navigate</text>

  <rect x="695" y="512" height="26" rx="8" fill="#111624" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <rect x="699" y="515" width="16" height="18" rx="4" fill="#232a3e" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <text x="703" y="528" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d88a8">→</text>
  <text x="719" y="527" font-family="Inter, sans-serif" font-size="10" fill="#47516b">Expand</text>

  <rect x="780" y="512" height="26" rx="8" fill="#111624" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <rect x="784" y="515" width="28" height="18" rx="4" fill="#232a3e" fill-opacity="0.38" stroke="#232a3e" stroke-opacity="0.25"/>
  <text x="788" y="528" font-family="JetBrains Mono, monospace" font-size="10" fill="#7d88a8">Enter</text>
  <text x="816" y="527" font-family="Inter, sans-serif" font-size="10" fill="#47516b">Select</text>

  <!-- Properties panel -->
  <rect x="1184" y="56" width="256" height="844" fill="#111624" fill-opacity="0.19" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.38"/>

  <!-- Properties header -->
  <rect x="1184" y="56" width="256" height="36" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.25"/>
  <rect x="1196" y="64" width="20" height="20" rx="6" fill="#4c6ef5" fill-opacity="0.1" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.13"/>
  <path d="M1202 72h8l2 2h4a2 2 0 012 2v6a2 2 0 01-2 2h-14a2 2 0 01-2-2v-8a2 2 0 012-2z" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <text x="1224" y="80" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.8">PROPERTIES</text>

  <!-- Empty properties state -->
  <rect x="1208" y="380" width="48" height="48" rx="12" fill="#232a3e" fill-opacity="0.25" stroke="#232a3e" stroke-opacity="0.19"/>
  <path d="M1223 405h18a3 3 0 013 3v12a3 3 0 01-3 3h-18a3 3 0 01-3-3v-12a3 3 0 013-3z" fill="none" stroke="#5c6685" stroke-width="1.5"/>
  <text x="1232" y="448" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#5c6685" text-anchor="middle">No file selected</text>
  <text x="1232" y="466" font-family="Inter, sans-serif" font-size="12" fill="#47516b" text-anchor="middle">Click any file in the explorer</text>
  <text x="1232" y="482" font-family="Inter, sans-serif" font-size="12" fill="#47516b" text-anchor="middle">to view its properties</text>
</svg>
