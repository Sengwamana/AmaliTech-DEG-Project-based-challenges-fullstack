<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <defs>
    <linearGradient id="selBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4c6ef5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#4c6ef5" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="480" height="340" fill="#090b14"/>

  <!-- Legend -->
  <text x="12" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">DEFAULT STATE</text>

  <!-- Folder node: default -->
  <rect x="8" y="36" width="280" height="36" rx="8" fill="transparent"/>
  <!-- Indent connector -->
  <rect x="15" y="48" width="1" height="24" fill="#232a3e" fill-opacity="0.25"/>
  <!-- Folder icon (closed) -->
  <path d="M28 50h12a2 2 0 012 2v4a2 2 0 01-2 2H28a2 2 0 01-2-2v-4a2 2 0 012-2z" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <path d="M28 48a2 2 0 012-2h4l2 2h4a2 2 0 012 2" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <!-- Name -->
  <text x="48" y="60" font-family="Inter, sans-serif" font-size="13" fill="#7d88a8">Projects</text>
  <!-- Chevron -->
  <polygon points="170,54 176,60 170,66" fill="#47516b" transform="rotate(0, 173, 60)"/>

  <!-- File node: default -->
  <rect x="8" y="76" width="280" height="36" rx="8" fill="transparent"/>
  <rect x="15" y="88" width="1" height="24" fill="#232a3e" fill-opacity="0.25"/>
  <!-- File icon -->
  <path d="M28 88a2 2 0 012-2h5l3 3h5a2 2 0 012 2v8a2 2 0 01-2 2H30a2 2 0 01-2-2v-11z" fill="none" stroke="#5c6685" stroke-width="1.5"/>
  <text x="48" y="100" font-family="Inter, sans-serif" font-size="13" fill="#7d88a8">report_q4_2025.pdf</text>

  <!-- Hover state -->
  <text x="12" y="144" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">HOVER STATE</text>

  <rect x="8" y="156" width="280" height="36" rx="8" fill="#232a3e" fill-opacity="0.38"/>
  <rect x="15" y="168" width="1" height="24" fill="#232a3e" fill-opacity="0.25"/>
  <!-- Folder icon (closed) -->
  <path d="M28 170h12a2 2 0 012 2v4a2 2 0 01-2 2H28a2 2 0 01-2-2v-4a2 2 0 012-2z" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <path d="M28 168a2 2 0 012-2h4l2 2h4a2 2 0 012 2" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <text x="48" y="180" font-family="Inter, sans-serif" font-size="13" fill="#d1d6e3">Projects</text>
  <!-- Chevron -->
  <polygon points="170,174 176,180 170,186" fill="#47516b" transform="rotate(0, 173, 180)"/>

  <!-- Selected state -->
  <text x="12" y="244" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">SELECTED STATE</text>

  <rect x="8" y="256" width="280" height="36" rx="8" fill="url(#selBg)" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.13"/>
  <!-- Left accent border -->
  <rect x="8" y="258" width="2" height="32" rx="1" fill="#4c6ef5"/>
  <!-- File icon -->
  <path d="M28 268a2 2 0 012-2h5l3 3h5a2 2 0 012 2v8a2 2 0 01-2 2H30a2 2 0 01-2-2v-11z" fill="none" stroke="#748ffc" stroke-width="1.5"/>
  <text x="48" y="280" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#91a7ff">report_q4_2025.pdf</text>

  <!-- Folder: expanded state -->
  <text x="12" y="324" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">FOLDER EXPANDED</text>
  <text x="200" y="324" font-family="Inter, sans-serif" font-size="10" fill="#47516b">(chevron rotates 90°, icon turns warning-400)</text>
</svg>
