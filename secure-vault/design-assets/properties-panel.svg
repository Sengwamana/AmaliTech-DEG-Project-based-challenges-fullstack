<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620">
  <defs>
    <linearGradient id="fileIconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b5bdb" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111624" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#111624" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="320" height="620" fill="#090b14"/>

  <!-- Empty state -->
  <text x="12" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">EMPTY STATE</text>

  <rect x="48" y="220" width="48" height="48" rx="12" fill="#232a3e" fill-opacity="0.25" stroke="#232a3e" stroke-opacity="0.19"/>
  <path d="M63 245h18a3 3 0 013 3v12a3 3 0 01-3 3h-18a3 3 0 01-3-3v-12a3 3 0 013-3z" fill="none" stroke="#5c6685" stroke-width="1.5"/>
  <text x="72" y="288" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#5c6685" text-anchor="middle">No file selected</text>
  <text x="72" y="306" font-family="Inter, sans-serif" font-size="12" fill="#47516b" text-anchor="middle">Click any file in the explorer</text>
  <text x="72" y="322" font-family="Inter, sans-serif" font-size="12" fill="#47516b" text-anchor="middle">to view its properties</text>

  <!-- Filled state -->
  <text x="12" y="380" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.5">FILE SELECTED</text>

  <!-- File info card -->
  <rect x="12" y="396" width="280" height="204" rx="12" fill="url(#cardBg)" stroke="#232a3e" stroke-width="1" stroke-opacity="0.5"/>

  <!-- File icon -->
  <rect x="24" y="408" width="40" height="40" rx="12" fill="url(#fileIconGrad)" stroke="#4c6ef5" stroke-width="1" stroke-opacity="0.13"/>
  <path d="M36 424h16a2 2 0 012 2v8a2 2 0 01-2 2H36a2 2 0 01-2-2v-8a2 2 0 012-2z" fill="none" stroke="#748ffc" stroke-width="1.5"/>

  <text x="76" y="426" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#d1d6e3" clip-path="url(#ellipsis)">report_q4_2025.pdf</text>
  <text x="76" y="442" font-family="JetBrains Mono, monospace" font-size="10" fill="#5c6685">doc-0042</text>

  <!-- Property rows -->
  <line x1="12" y1="462" x2="292" y2="462" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.25"/>

  <text x="24" y="484" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.8">NAME</text>
  <text x="24" y="500" font-family="Inter, sans-serif" font-size="13" fill="#d1d6e3">report_q4_2025.pdf</text>

  <line x1="12" y1="514" x2="292" y2="514" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.25"/>

  <text x="24" y="532" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.8">TYPE</text>
  <text x="24" y="548" font-family="Inter, sans-serif" font-size="13" fill="#d1d6e3">PDF Document</text>

  <line x1="12" y1="562" x2="292" y2="562" stroke="#232a3e" stroke-width="0.5" stroke-opacity="0.25"/>

  <text x="24" y="580" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5c6685" letter-spacing="0.8">SIZE</text>
  <text x="24" y="596" font-family="JetBrains Mono, monospace" font-size="12" fill="#a8b1c9">2.4 MB</text>
</svg>
